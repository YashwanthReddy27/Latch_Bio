[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-screen-bench-mini"
version = "0.1.0"
description = "CRISPRScreenBench-mini: verifiable pooled CRISPR knockout screen analysis tasks for AI agents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
